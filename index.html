<!DOCTYPE html>
<html lang="zh-CN" data-base="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />

  <!--
    标题和描述会直接变成微信/QQ 等社交软件里的分享卡片文字，
    所以这里写的是给玩家看的话，不是给开发者看的。
  -->
  <title>无名之夏 · 一个关于夏天的故事</title>
  <meta name="description" content="转学来的那个夏天，你遇见了深雪。三个结局，由你的每一个选择决定。" />

  <!--
    社交分享卡片。
    微信、QQ、微博等抓取链接预览时优先读 og: / twitter: 这几组标签。

    ⚠️⚠️ og:image 和 twitter:image 必须是**完整的绝对网址**，
        相对路径在微信里抓不到图，卡片就只剩一行纯文字（点开率差很多）。

        部署完拿到网址后，用这个命令一次替换（把网址换成你自己的）：
            node tools/set-share-url.mjs https://你的用户名.github.io/galgame/

        没设置之前这里指的是相对路径，在部分客户端上会失效 —— 但不影响游戏本身。
  -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="无名之夏 · 一个关于夏天的故事" />
  <meta property="og:description" content="转学来的那个夏天，你遇见了深雪。三个结局，由你的每一个选择决定。" />
  <meta property="og:image" content="https://yibeimaofei.github.io/galgame/assets/ui/share-card.png" data-share-image />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="无名之夏" />
  <meta property="og:url" content="https://yibeimaofei.github.io/galgame/" data-share-url />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="无名之夏 · 一个关于夏天的故事" />
  <meta name="twitter:description" content="转学来的那个夏天，你遇见了深雪。三个结局，由你的每一个选择决定。" />
  <meta name="twitter:image" content="https://yibeimaofei.github.io/galgame/assets/ui/share-card.png" data-share-image />

  <!-- 手机上添加到主屏时的表现 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="无名之夏" />
  <meta name="theme-color" content="#0b1020" />

  <!-- 把这一段改成你游戏的界面配色即可，不需要动 CSS 文件 -->
  <style>
    :root {
      --gal-accent: #7fb2e5;
      --gal-accent-soft: #3f5d80;
      --gal-text: #e8eef8;
      --gal-textbox-bg: rgba(10, 14, 24, 0.82);
    }
  </style>

  <link rel="icon" type="image/png" href="https://yibeimaofei.github.io/galgame/assets/ui/favicon.png" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <noscript>
    <p style="color:#fff;padding:2rem">这个游戏需要启用 JavaScript。</p>
  </noscript>

  <div id="game" class="gal-root" aria-live="polite"></div>

  <!-- 引导脚本：只负责给出可读的报错，真正的逻辑在 src/main.js -->
  <script type="module">
    const host = document.getElementById('game');
    const fail = (title, detail) => {
      host.innerHTML = `
        <div class="boot-error">
          <h1>${title}</h1>
          <pre>${String(detail).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))}</pre>
          <p>排查顺序：① 是否用 HTTP 打开（<code>node server.js</code> 或 <code>start.bat</code>）而不是双击 index.html；
          ② 浏览器控制台（F12）里的第一条红色报错；③ 终端里 <code>node tools/validate.mjs</code> 的输出。</p>
        </div>`;
    };

    try {
      const { start } = await import('./src/main.js');
      await start(host);
    } catch (error) {
      fail('启动失败', error?.stack ?? error);
      throw error;
    }
  </script>
</body>
</html>
